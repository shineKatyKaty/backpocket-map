name = "backpocket-map-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# --- D1 (SQLite) ---
# `wrangler d1 create backpocket-map` で発行される database_id をここに貼る。
[[d1_databases]]
binding = "DB"
database_name = "backpocket-map"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# --- 変数（公開してよい設定。秘密情報はここに書かない） ---
[vars]
# フロントエンド（Cloudflare Pages）のオリジン。CORS 許可に使う。
# ローカル開発では Vite の http://localhost:5173 を許可。
# 本番デプロイ後、Pages の本番URL（https://<project>.pages.dev）に変更する。
ALLOW_ORIGIN = "http://localhost:5173"
# Gemini モデル名（秘密ではないのでここに置く）。API キーは secret。
GEMINI_MODEL = "gemini-3.5-flash-lite"

# --- 秘密情報（コミットしない） ---
# ショートカット同期の共有シークレット:
#   本番:  wrangler secret put SYNC_SECRET
#   ローカル: worker/.dev.vars に SYNC_SECRET=... を書く（.gitignore 済み）
